<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Extended Display Hub</title>
    <!-- Legacy-compatible WebRTC / PeerJS library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/0.3.16/peer.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }
        .container {
            width: 90%;
            max-width: 420px;
            background: #1e293b;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { margin-bottom: 12px; font-size: 1.3rem; color: #38bdf8; }
        p { font-size: 0.88rem; color: #94a3b8; margin-bottom: 20px; line-height: 1.4; }
        .btn {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary { background: #0284c7; color: white; }
        .btn-success { background: #16a34a; color: white; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 1.3rem;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 12px;
            outline: none;
        }
        .code-box {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 6px;
            color: #38bdf8;
            background: #0f172a;
            padding: 14px;
            border-radius: 8px;
            margin: 15px 0;
        }
        .hidden { display: none !important; }
        
        #display-view {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            z-index: 99999;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100vw;
            height: 100vh;
            object-fit: fill;
        }
        .status { font-size: 0.85rem; color: #fbbf24; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Selection Screen -->
    <div id="selection-card" class="container">
        <h2>Extended Screen Hub</h2>
        <p>Select device role:</p>
        <button class="btn btn-primary" onclick="initLaptop()">💻 Laptop (Host Screen)</button>
        <button class="btn btn-success" onclick="showTabletLogin()">📱 Dell Venue Tablet</button>
    </div>

    <!-- Laptop Host Screen -->
    <div id="laptop-card" class="container hidden">
        <h2>Host Authentication PIN</h2>
        <p>Enter this 4-digit code on your Dell Venue tablet:</p>
        <div id="display-pin" class="code-box">----</div>
        <p class="status" id="host-status">Waiting for tablet to connect...</p>
    </div>

    <!-- Tablet Login Screen -->
    <div id="tablet-card" class="container hidden">
        <h2>Enter Laptop PIN</h2>
        <p>Type the 4-digit code shown on your laptop:</p>
        <input type="text" id="input-pin" placeholder="••••" maxlength="4" />
        <button class="btn btn-success" onclick="connectTablet()">Connect</button>
        <p class="status" id="tablet-status"></p>
    </div>

    <!-- Fullscreen Video Viewport -->
    <div id="display-view" class="hidden">
        <video id="stream-video" autoplay playsinline></video>
    </div>

    <script>
        // Prefix ensures no collision with other public PeerJS users
        var PREFIX = "v7-screen-";
        var peer = null;
        var activeDataConn = null;

        // Legacy browser compatibility shims for Android KitKat
        window.URL = window.URL || window.webkitURL || window.mozURL;
        window.RTCPeerConnection = window.RTCPeerConnection || window.webkitRTCPeerConnection || window.mozRTCPeerConnection;

        function getRandomPin() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        // ================= LAPTOP (HOST) =================
        function initLaptop() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                alert("Please use Chrome or Edge on your laptop for screen capture.");
                return;
            }

            navigator.mediaDevices.getDisplayMedia({
                video: { frameRate: { ideal: 30 } },
                audio: false
            }).then(function(stream) {
                var pin = getRandomPin();
                document.getElementById('display-pin').innerText = pin;
                document.getElementById('selection-card').className += " hidden";
                document.getElementById('laptop-card').className = document.getElementById('laptop-card').className.replace("hidden", "");

                // Initialize Host Peer
                peer = new Peer(PREFIX + pin, {
                    config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] }
                });

                peer.on('call', function(call) {
                    call.answer(stream);
                    document.getElementById('host-status').innerText = "Tablet connected! Display streaming.";
                    document.getElementById('host-status').style.color = "#4ade80";
                });

                peer.on('connection', function(conn) {
                    activeDataConn = conn;
                    conn.on('data', function(msg) {
                        // Relays touch click coordinates to local Python helper if active
                        if (window.localWs && window.localWs.readyState === 1) {
                            window.localWs.send(JSON.stringify(msg));
                        }
                    });
                });

                try {
                    window.localWs = new WebSocket("ws://127.0.0.1:8765");
                } catch(e) {}

            }).catch(function(err) {
                alert("Screen share cancelled or permission denied.");
            });
        }

        // ================= TABLET (RECEIVER) =================
        function showTabletLogin() {
            document.getElementById('selection-card').className += " hidden";
            document.getElementById('tablet-card').className = document.getElementById('tablet-card').className.replace("hidden", "");
        }

        function connectTablet() {
            var pinInput = document.getElementById('input-pin');
            var pin = pinInput.value.replace(/\s+/g, '');
            
            if (pin.length !== 4) {
                alert("Please enter a 4-digit PIN.");
                return;
            }

            var statusEl = document.getElementById('tablet-status');
            statusEl.innerText = "Connecting to laptop...";
            statusEl.style.color = "#fbbf24";

            // Initialize Client Peer
            peer = new Peer(null, {
                config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', function() {
                var targetPeerId = PREFIX + pin;
                
                // Establish DataChannel for Touch/Click inputs
                activeDataConn = peer.connect(targetPeerId);

                // Call the host to receive video stream
                var call = peer.call(targetPeerId, null);

                if (!call) {
                    statusEl.innerText = "Error: Cannot initiate call. Check PIN.";
                    statusEl.style.color = "#f87171";
                    return;
                }

                call.on('stream', function(remoteStream) {
                    document.getElementById('tablet-card').className += " hidden";
                    var displayView = document.getElementById('display-view');
                    var video = document.getElementById('stream-video');
                    
                    displayView.className = displayView.className.replace("hidden", "");

                    // Android KitKat video source assignment fallback
                    if ("srcObject" in video) {
                        try {
                            video.srcObject = remoteStream;
                        } catch (err) {
                            video.src = window.URL.createObjectURL(remoteStream);
                        }
                    } else if (window.URL && window.URL.createObjectURL) {
                        video.src = window.URL.createObjectURL(remoteStream);
                    } else {
                        video.src = remoteStream;
                    }

                    video.play();

                    // Fullscreen activation for KitKat
                    if (displayView.requestFullscreen) {
                        displayView.requestFullscreen();
                    } else if (displayView.webkitRequestFullscreen) {
                        displayView.webkitRequestFullscreen();
                    }

                    // Attach Touch Controller
                    displayView.addEventListener('click', handleTabletClick, false);
                    displayView.addEventListener('touchstart', handleTabletTouch, false);
                });

                call.on('error', function() {
                    statusEl.innerText = "Invalid PIN or Laptop offline.";
                    statusEl.style.color = "#f87171";
                });
            });

            peer.on('error', function(err) {
                statusEl.innerText = "Connection error. Re-check PIN.";
                statusEl.style.color = "#f87171";
            });
        }

        // ================= TOUCH / CLICK CONTROL =================
        function handleTabletClick(e) {
            sendCoordinates(e.clientX, e.clientY);
        }

        function handleTabletTouch(e) {
            if (e.touches && e.touches.length > 0) {
                sendCoordinates(e.touches[0].clientX, e.touches[0].clientY);
            }
        }

        function sendCoordinates(clientX, clientY) {
            if (activeDataConn && activeDataConn.open) {
                var normX = clientX / window.innerWidth;
                var normY = clientY / window.innerHeight;
                activeDataConn.send({ type: "click", x: normX, y: normY });
            }
        }
    </script>
</body>
</html>
